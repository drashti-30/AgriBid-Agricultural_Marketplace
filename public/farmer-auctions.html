<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage your AgriBid crop auctions">
    <title>AgriBid — My Auctions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { agrigreen: {
            50: "#f0fdf4", 100: "#dcfce7", 600: "#16a34a", 700: "#15803d"
        } } } } };
    </script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
    <nav class="bg-agrigreen-700 text-white shadow-lg">
        <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
            <a href="/farmer-dashboard.html" class="flex items-center gap-3">
                <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-white/15 font-bold">AB</span>
                <span><strong class="block text-xl">AgriBid</strong><small class="text-green-100">Farmer workspace</small></span>
            </a>
            <div class="flex items-center gap-4 text-sm">
                <a href="/farmer-dashboard.html" class="font-medium text-green-50 hover:text-white">Dashboard</a>
                <a href="/auctions.html" class="font-medium text-green-50 hover:text-white">Marketplace</a>
                <button id="logoutButton" class="rounded-lg bg-white px-4 py-2 font-semibold text-agrigreen-700 hover:bg-green-50">Logout</button>
            </div>
        </div>
    </nav>

    <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
        <div class="mb-8 flex flex-col justify-between gap-4 sm:flex-row sm:items-end">
            <div>
                <p class="mb-1 text-sm font-semibold text-agrigreen-600">FARMER WORKSPACE</p>
                <h1 class="text-3xl font-bold text-slate-900">My Auctions</h1>
                <p class="mt-2 text-slate-500">View and manage only the crop auctions you created.</p>
            </div>
            <a href="/auctions.html" class="inline-flex items-center justify-center rounded-xl border border-agrigreen-600 bg-white px-5 py-3 text-sm font-semibold text-agrigreen-700 hover:bg-green-50">Create auction</a>
        </div>

        <div id="farmerAuctionsMessage" class="mb-5" aria-live="polite"></div>
        <section id="farmerAuctionList" class="grid gap-5 md:grid-cols-2 xl:grid-cols-3" aria-live="polite">
            <div class="rounded-2xl border border-slate-200 bg-white p-6 text-slate-500 shadow-sm">Loading your auctions…</div>
        </section>
    </main>

    <script src="/dashboard-common.js"></script>
    <script src="/farmer-auctions.js"></script>
</body>
</html>
