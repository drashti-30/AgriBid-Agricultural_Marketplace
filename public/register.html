<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register for AgriBid">
    <title>AgriBid — Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="/">AgriBid</a>
            <div class="ms-auto d-flex gap-2">
                <a href="/login.html" class="btn btn-outline-light btn-sm">Login</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-9 col-lg-7 col-xl-6">
                <div class="card border-0 shadow">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <span class="badge text-bg-success mb-2">Join AgriBid</span>
                            <h1 class="h2 fw-bold text-success">Create Your Account</h1>
                            <p class="text-muted mb-0">Register as a farmer or buyer.</p>
                        </div>

                        <div id="registerMessage"></div>

                        <form id="registerForm" novalidate>
                            <div class="row g-3">
                                <div class="col-12 col-md-6">
                                    <label for="firstName" class="form-label fw-semibold">First Name</label>
                                    <input type="text" class="form-control" id="firstName" placeholder="Enter first name" required>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="lastName" class="form-label fw-semibold">Last Name</label>
                                    <input type="text" class="form-control" id="lastName" placeholder="Enter last name" required>
                                </div>

                                <div class="col-12">
                                    <label for="email" class="form-label fw-semibold">Email Address</label>
                                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="phone" class="form-label fw-semibold">Phone Number</label>
                                    <input type="tel" class="form-control" id="phone" placeholder="Enter phone number" pattern="[0-9]{10}" required>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="role" class="form-label fw-semibold">Register As</label>
                                    <select class="form-select" id="role" required>
                                        <option value="">Select role</option>
                                        <option value="Farmer">Farmer</option>
                                        <option value="Buyer">Buyer</option>
                                    </select>
                                </div>

                                <div class="col-12">
                                    <label for="address" class="form-label fw-semibold">Address</label>
                                    <textarea class="form-control" id="address" rows="3" minlength="5" placeholder="Enter your address" required></textarea>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="password" class="form-label fw-semibold">Password</label>
                                    <input type="password" class="form-control" id="password" placeholder="Create password" minlength="6" required>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
                                    <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm password" minlength="6" required>
                                </div>

                                <div class="col-12">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="terms" required>
                                        <label class="form-check-label" for="terms">
                                            I agree to the AgriBid terms and conditions.
                                        </label>
                                    </div>
                                </div>

                                <div class="col-12">
                                    <button type="submit" class="btn btn-success btn-lg w-100">
                                        Create Account
                                    </button>
                                </div>
                            </div>
                        </form>

                        <p class="text-center text-muted mt-4 mb-0">
                            Already have an account?
                            <a href="/login.html" class="text-success fw-semibold">Login here</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
